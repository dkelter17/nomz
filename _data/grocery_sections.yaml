# Keyword -> grocery-section map used by the shopping list page to group
# aggregated ingredient lines the same way the household's shared grocery
# note is organized. `order` is the fixed section order used everywhere
# (page rendering and the copied text), always printed even when a section
# has no matches. `keywords` maps each section to ingredient-name fragments;
# matching is longest-keyword-wins (see assets/js/shopping-list.js), so a
# specific phrase like "dried oregano" or "frozen peas" should always be
# listed even though a shorter, more generic keyword ("oregano", "peas")
# would otherwise misfile it.
#
# If an ingredient keeps landing in the "Sort These" bucket on the shopping
# list page, add a keyword for it here and commit.
order: [Produce, Meat, Dairy, Frozen, Bakery, Grocery, Pharmacy]
